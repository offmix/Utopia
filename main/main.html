<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Utopia Light - Settings</title>
  <style>
    :root {
      --bg: #f3f7ff;
      --panel: #ffffff;
      --text: #152033;
      --muted: #5d6b82;
      --accent: #3b82f6;
      --border: #dfe8f7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #f3f7ff, #eaf1ff);
      color: var(--text);
      padding: 32px 20px;
    }

    .wrap {
      max-width: 820px;
      margin: 0 auto;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(37, 99, 235, 0.08);
      padding: 28px;
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(1.8rem, 3vw, 2.2rem);
    }

    .setting {
      border-top: 1px solid var(--border);
      padding: 18px 0;
    }

    .setting:first-of-type {
      border-top: none;
      padding-top: 0;
    }

    .label {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .hint {
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .navlink {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h1>Utopia Light Settings</h1>

      <div class="setting">
        <div class="label">Hidden Mode</div>
        <div class="hint">Hide browsing activity from local history when using the proxy.</div>
        <div class="row">
          <label><input type="checkbox" checked /> Enable</label>
        </div>
      </div>

      <div class="setting">
        <div class="label">Tab Cloak</div>
        <div class="hint">Disguise the current tab while browsing.</div>
        <div class="row">
          <label><input type="checkbox" /> Enable</label>
        </div>
      </div>

      <div class="setting">
        <div class="label">Quick Links</div>
        <div class="hint">Keep a few frequently visited sites close at hand.</div>
        <div class="row">
          <label><input type="checkbox" checked /> Enable</label>
        </div>
      </div>

      <div class="setting">
        <div class="label">Theme</div>
        <div class="hint">Minimal interface built for a lighter, faster browsing setup.</div>
        <div class="row">
          <a class="navlink" href="/">Back to home</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
