<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Utopia Light</title>
  <style>
    :root {
      --bg: #f3f7ff;
      --panel: #ffffff;
      --panel-2: #edf4ff;
      --text: #152033;
      --muted: #5d6b82;
      --accent: #3b82f6;
      --accent-strong: #2563eb;
      --border: #dfe8f7;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, var(--bg), #eaf1ff 100%);
      color: var(--text);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .wrap {
      width: min(960px, 100%);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 26px;
      gap: 16px;
    }

    .brand {
      font-size: clamp(1.7rem, 2.2vw, 2.5rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--accent);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .nav a {
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      opacity: 0.8;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(37, 99, 235, 0.08);
      padding: 28px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.8rem, 3vw, 2.5rem);
      color: var(--text);
    }

    .subtitle {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 1rem;
    }

    .proxy-box {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .proxy-box input {
      flex: 1 1 420px;
      min-width: 240px;
      height: 52px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      padding: 0 16px;
      font-size: 1rem;
      outline: none;
    }

    .proxy-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
    }

    .proxy-box button {
      height: 52px;
      border: none;
      border-radius: 12px;
      padding: 0 22px;
      background: linear-gradient(180deg, var(--accent), var(--accent-strong));
      color: white;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }

    .proxy-box button:hover {
      filter: brightness(1.03);
    }

    .mini {
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .mini a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">Utopia Light</div>
      <div class="nav">
        <a href="/main.html">Proxy</a>
        <a href="/settings.html">Settings</a>
      </div>
    </div>

    <div class="panel">
      <h1>Proxy</h1>
      <p class="subtitle">Quickly open a site through the lightweight proxy with a clean, simple interface.</p>

      <form id="proxyForm">
        <div class="proxy-box">
          <input id="siteInput" type="text" placeholder="https://example.com" autocomplete="off" />
          <button type="submit">Go</button>
        </div>
      </form>

      <div class="mini">
        <a href="/settings.html">Open settings</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('proxyForm');
    const input = document.getElementById('siteInput');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      let value = input.value.trim();
      if (!value) return;
      if (!/^https?:\/\//i.test(value)) {
        value = 'https://' + value;
      }
      const url = new URL('/main.html', window.location.origin);
      url.searchParams.set('url', value);
      window.location.href = url.toString();
    });
  </script>
</body>
</html>
